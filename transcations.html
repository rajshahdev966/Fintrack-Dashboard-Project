<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/output.css" />
    <link rel="stylesheet" href="" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-(--bg-primary) font-(--font-mono) text-nowrap flex"
    id="transactions-page"
  >
    <div
      class="w-full h-full rounded-2xlbg-transparent p-8 shadow-sm absolute backdrop-blur-sm flex justify-center items-center hidden"
      id="transFormCard"
    >
      <div
        class="w-max h-max bg-white rounded-2xl border-slate-200 p-8 shadow-sm"
      >
        <!-- Header -->
        <div class="mb-8">
          <h2 class="text-3xl font-bold text-slate-800">Add Transaction</h2>
          <p class="mt-2 text-sm text-slate-500">
            Record a new income or expense.
          </p>
        </div>
        <form class="space-y-6">
          <!-- Type -->
          <div>
            <label class="mb-3 block text-sm font-semibold text-slate-700">
              Transaction Type
            </label>
            <select
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
              id="trans-type"
            >
              <option>Income</option>
              <option>Expense</option>
            </select>
          </div>
          <!-- Amount -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-slate-700">
              Amount
            </label>
            <input
              type="number"
              placeholder="₹0.00"
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
            />
          </div>
          <!-- Purpose -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-slate-700">
              Purpose
            </label>
            <input
              type="text"
              placeholder="Amazon"
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
            />
          </div>
          <!-- Category -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-slate-700">
              Category
            </label>
            <select
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
            >
              <option>Food</option>
              <option>Shopping</option>
              <option>Travel</option>
              <option>Salary</option>
              <option>Investment</option>
              <option>Utilities</option>
            </select>
          </div>
          <!-- Date -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-slate-700">
              Date
            </label>
            <input
              type="date"
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
            />
          </div>
          <!-- Buttons -->
          <div class="flex justify-end gap-4 pt-4">
            <button
              type="button"
              class="rounded-xl border border-slate-300 px-6 py-3 font-semibold text-slate-600 transition hover:bg-slate-100"
              id="cancelBtn"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="rounded-xl bg-sky-500 px-6 py-3 font-semibold text-white shadow transition hover:bg-sky-600"
              id="submit-btn"
            >
              Save Transaction
            </button>
          </div>
        </form>
      </div>
    </div>

    
     <nav class="navbar">
      <div class="upper-nav flex flex-col gap-5">
        <!-- NAVBAR LOGO  -->
        <div class="logo-text text-(--primary) text-4xl font-semibold">
          FinTrack Pro
        </div>
        <!-- NAVBAR MENU  -->
        <div class="nav-menu text-(length:--text-xl) flex flex-col gap-4">
          <div class="dashboard-a navbar-links" href="./index.html">
            <i class="ri-dashboard-fill"></i>
            <a href="./index.html">Dashboard</a>
          </div>
          <div class="transcations-a navbar-selected">
            <i class="ri-cash-line"></i>
            <a href="./transcations.html">Transcations</a>
          </div>

          <div class="settings-a navbar-links">
            <i class="ri-settings-2-line"></i>
            <a href="./settings.html">Settings</a>
          </div>
        </div>
      </div>
      <!-- NAVBAR AVATAR  -->
      <div
        class="profile-section flex gap-2 items-center p-4 rounded-[var(--radius-md)] hover:bg-(--bg-tertiary) cursor-pointer"
      >
        <div class="profile-photo">
          <div
            class="h-10 w-10 rounded-full bg-(--primary) flex items-center justify-center text-xl font-bold text-slate-600"
            id="profile-icon"
          ></div>
        </div>
        <div class="profile-name text-(--text-primary)">
          <span>ALEX MORGAN</span>
        </div>
      </div>
    </nav>

    <div class="w-full bg-(--bg-primary) shadow-sm flex flex-col gap-4">
      <!-- Header -->
      <div
        class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-6 p-8"
      >
        <div>
          <h2 class="text-3xl font-bold text-(--text-primary)">Transactions</h2>

          <p class="mt-2 text-(--text-muted)">
            Manage and track all your fiscal movements
          </p>
        </div>

        <div class="flex gap-4">
          <div
            class="rounded-xl border border-(--border-light) px-6 py-3 bg-(--bg-tertiary)"
          >
            <p
              class="text-(length:--text-base) uppercase tracking-widest text-(--text-secondary) font-semibold"
            >
              Total Items
            </p>

            <p
              class="text-2xl font-bold text-(--primary) text-(length:--text-3xl)"
              id="total-trans"
            ></p>
          </div>

          <button
            class="rounded-xl bg-(--primary) hover:bg-(--primary-hover) transition px-8 py-4 font-semibold text-(--surface) flex items-center gap-3 text-(length:--text-xl)"
            id="add-new-btn"
          >
            <i class="ri-add-large-line"></i>
            <span>Add New</span>
          </button>
        </div>
      </div>

      <!-- Filters -->
      <div
        class="flex flex-col lg:flex-row justify-between gap-5 p-3 bg-(--bg-tertiary)"
      >
        <div class="flex rounded-xl bg-(--surface) p-2 gap-1">
          <button
            class="rounded-lg bg-(--primary) hover:bg-(--primary-hover) hover:text-(--text-primary) cursor-pointer px-6 py-2 text-(--text-primary) font-semibold"
            id="all-btn"
          >
            All
          </button>

          <button
            class="rounded-lg px-6 py-2 text-(--text-secondary) hover:bg-(--primary-hover) hover:text-(--text-primary) cursor-pointer"
            id="inc-sort-btn"
          >
            Income
          </button>

          <button
            class="rounded-lg px-6 py-2 text-(--text-secondary) hover:bg-(--primary-hover) hover:text-(--text-primary) cursor-pointer"
            id="exp-sort-btn"
          >
            Expense
          </button>
        </div>
      </div>

      <!-- Table -->
      <div class="px-6 pb-6">
        <div
          class="overflow-x-auto rounded-2xl border border-(--border) text-(--text-secondary)"
        >
          <table class="w-full">
            <!-- Table Head -->
            <thead class="bg-(--bg-secondary)">
              <tr
                class="text-left text-xs uppercase tracking-wide text-(--text-muted)"
              >
                <th class="px-6 py-5">Date</th>
                <th class="px-6 py-5">Category</th>
                <th class="px-6 py-5">Description</th>
                <th class="px-6 py-5 text-right">Amount</th>
                <th class="px-6 py-5 text-center">Actions</th>
              </tr>
            </thead>

            <!-- Body -->
            <tbody
              class="bg-(--bg-tertiary) "
              id="trans-table"
            ></tbody>
          </table>
        </div>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
