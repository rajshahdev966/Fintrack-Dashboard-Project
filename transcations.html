<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/output.css" />
    <link rel="stylesheet" href="" />
    <style>
      :root {
        --bg-primary: #eef1f6;
        --bg-secondary: #ffffff;
        --bg-tertiary: #e4e9f1;
        --primary: #14544a;
        --primary-hover: #0e3d35;
        --secondary: #2f7d5c;
        --danger: #b8433a;
        --text-primary: #16211f;
        --text-secondary: #64748b;
        --text-muted: #8a94a3;
        --border: #dbe2ec;
        --border-light: #e6ebf2;
        --surface: #ffffff;
        --surface-dim: #edf1f6;
        --radius-md: 1.1rem;
        --shadow-md: 0 14px 34px -16px rgba(20, 84, 74, 0.28);
        --font-mono: "JetBrains Mono", "Courier New", ui-monospace, monospace;
        --text-xl: 1.125rem;
        --text-base: 0.75rem;
        --text-3xl: 1.5rem;
      }
      #transactions-page { background-image: radial-gradient(var(--bg-tertiary) 1px, transparent 1px); background-size: 22px 22px; }
      .ri-dashboard-fill::before { content: "▦"; }
      .ri-cash-line::before { content: "◧"; }
      .ri-settings-2-line::before { content: "⚙"; }
      .ri-add-large-line::before { content: "+"; }
      .upper-nav .logo-text { font-family: Georgia, serif; letter-spacing: -0.01em; }
      #total-trans { font-family: Georgia, "Times New Roman", serif; }
      @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .rise-1 { animation: riseIn .5s ease-out both; }
      .rise-2 { animation: riseIn .5s ease-out .08s both; }
      #trans-table tr { transition: background-color .15s ease; }
      #trans-table tr:hover { background-color: var(--surface-dim); }
    </style>
  </head>
  <body class="bg-[var(--bg-primary)] font-[var(--font-mono)] text-nowrap flex" id="transactions-page"> 

    <div class="w-full h-full rounded-2xl border border-slate-200 bg-transparent p-8 shadow-sm absolute backdrop-blur-md flex justify-center items-center hidden z-50" id="transFormCard">

    <div class="w-max h-max bg-white rounded-2xl border-slate-200 p-8 shadow-2xl">
        <!-- Header -->
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-slate-800" style="font-family: Georgia, serif;">
                Add Transaction
            </h2>
            <p class="mt-2 text-sm text-slate-500">
                Record a new income or expense.
            </p>
        </div>
        <form class="space-y-6">
            <!-- Type -->
            <div>
                <label class="mb-3 block text-sm font-semibold text-slate-700">
                    Transaction Type
                </label>
                <select
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-[var(--primary)] focus:ring-4 focus:ring-emerald-100" id="trans-type">
                    <option>Income</option>
                    <option>Expense</option>
                </select>
            </div>
            <!-- Amount -->
            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">
                    Amount
                </label>
                <input
                    type="number"
                    placeholder="₹0.00"
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-[var(--primary)] focus:ring-4 focus:ring-emerald-100">
            </div>
            <!-- Purpose -->
            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">
                    Purpose
                </label>
                <input
                    type="text"
                    placeholder="Amazon"
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-[var(--primary)] focus:ring-4 focus:ring-emerald-100">
            </div>
            <!-- Category -->
            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">
                    Category
                </label>
                <select
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-[var(--primary)] focus:ring-4 focus:ring-emerald-100">
                    <option>Food</option>
                    <option>Shopping</option>
                    <option>Travel</option>
                    <option>Salary</option>
                    <option>Investment</option>
                    <option>Utilities</option>
                </select>
            </div>
            <!-- Date -->
            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">
                    Date
                </label>
                <input
                    type="date"
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-[var(--primary)] focus:ring-4 focus:ring-emerald-100">
            </div>
            <!-- Buttons -->
            <div class="flex justify-end gap-4 pt-4">
                <button
                    type="button"
                    class="rounded-xl border border-slate-300 px-6 py-3 font-semibold text-slate-600 transition hover:bg-slate-100" id="cancelBtn">
                    Cancel
                </button>
                <button
                    type="submit"
                    class="rounded-xl bg-[var(--primary)] px-6 py-3 font-semibold text-white shadow transition hover:bg-[var(--primary-hover)] hover:-translate-y-0.5" id="submitBtn">
                    Save Transaction
                </button>
            </div>
        </form>
    </div>

</div>
    <nav
      class="bg-[var(--bg-secondary)] h-screen w-min flex flex-col justify-between p-5 shadow-(--shadow-md) border-r border-slate-200"
    >
      <div class="upper-nav flex flex-col gap-5">
        <div class="logo-text text-(--primary) text-4xl font-semibold">
          FinTrack Pro
        </div>
        <div class="nav-menu text-(length:--text-xl) flex flex-col gap-4">
          <div class="dashboard-a flex gap-2 items-center p-4 rounded-[var(--radius-md)] hover:bg-(--bg-tertiary) transition cursor-pointer text-(--text-primary)" href="./index.html">
            <i class="ri-dashboard-fill"></i> <a href="./index.html">Dashboard</a>
          </div>
          <div class="transcations-a flex gap-2 items-center p-4 rounded-[var(--radius-md)] bg-(--primary) cursor-pointer text-white shadow-(--shadow-md)">
            <i class="ri-cash-line"></i> <a href="./transcations.html">Transcations</a>
          </div>
            
          <div class="settings-a flex gap-2 items-center p-4 rounded-[var(--radius-md)] hover:bg-(--bg-tertiary) transition cursor-pointer text-(--text-primary)">
            <i class="ri-settings-2-line"></i> <a href="./settings.html">Settings</a>
          </div>
        </div>
      </div>
      <div class="profile-section flex gap-2 items-center p-4 rounded-[var(--radius-md)] hover:bg-(--bg-tertiary) transition cursor-pointer">
        <div class="profile-photo">
          <img
            src="https://plus.unsplash.com/premium_photo-1683121366070-5ceb7e007a97?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="user profile photo" class="h-[50px] w-[50px] rounded-[50%] ring-2 ring-(--primary)/20"
          />
        </div>
        <div class="profile-name text-(--text-primary)"><span>ALEX MORGAN</span></div>
        </div>
      </div>
    </nav>
    
    <div class="w-full bg-(--bg-primary) shadow-sm flex flex-col gap-4">

    <!-- Header -->
    <div class="rise-1 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-6 p-8">

        <div>
            <h2 class="text-3xl font-bold text-(--text-primary)" style="font-family: Georgia, serif;">
                Transactions
            </h2>

            <p class="mt-2 text-(--text-muted)">
                Manage and track all your fiscal movements
            </p>
        </div>

        <div class="flex gap-4">

            <div class="rounded-xl border border-(--border-light) px-6 py-3 bg-(--bg-secondary) shadow-(--shadow-md)">
                <p class="text-(length:--text-base) uppercase tracking-widest text-(--text-secondary) font-semibold">
                    Total Items
                </p>

                <p class="text-2xl font-bold text-(--primary) text-(length:--text-3xl)" id="total-trans">
                    
                </p>
            </div>

            <button
                class="rounded-xl bg-(--primary) hover:bg-(--primary-hover) transition px-8 py-4 font-semibold text-(--surface) flex items-center gap-3 text-(length:--text-xl) hover:-translate-y-0.5 shadow-(--shadow-md)" id="add-new-btn">
                <i class="ri-add-large-line"></i>
                <span>Add New</span>
            </button>

        </div>

    </div>

    <!-- Filters -->
    <div class="rise-2 flex flex-col lg:flex-row justify-between gap-5 p-3 mx-6 rounded-2xl bg-(--bg-secondary) border border-(--border-light)">

        <div class="flex rounded-xl bg-(--bg-tertiary) p-2 gap-1">

            <button class="rounded-lg bg-(--primary) hover:bg-(--primary-hover) cursor-pointer px-6 py-2 text-white font-semibold transition">
                All
            </button>

            <button class="rounded-lg px-6 py-2 text-(--text-secondary) hover:bg-(--surface) cursor-pointer transition">
                Income
            </button>

            <button class="rounded-lg px-6 py-2 text-(--text-secondary) hover:bg-(--surface) cursor-pointer transition">
                Expense
            </button>

        </div>

        <div class="flex gap-3">

            <button
                class="rounded-xl border border-(--border) px-5 py-2 text-(--text-secondary) hover:bg-(--bg-tertiary) transition">
                Last 30 Days ▼
            </button>

            <button
                class="rounded-xl border border-(--border) px-4 py-2 text-(--text-secondary) hover:bg-(--bg-tertiary) transition">
                ☰
            </button>

        </div>

    </div>

    <!-- Table -->
    <div class="px-6 pb-6">

        <div class="overflow-x-auto rounded-2xl border border-(--border) text-(--text-secondary) shadow-(--shadow-md)">

            <table class="w-full">

                <!-- Table Head -->
                <thead class="bg-(--bg-secondary)">

                    <tr class="text-left text-xs uppercase tracking-wide text-(--text-muted)">

                        <th class="px-6 py-5">Date</th>
                        <th class="px-6 py-5">Category</th>
                        <th class="px-6 py-5">Description</th>
                        <th class="px-6 py-5 text-right">Amount</th>
                        <th class="px-6 py-5 text-center">Actions</th>

                    </tr>

                </thead>

                <!-- Body -->
                <tbody class="divide-y divide-(--surface-dim) bg-(--bg-tertiary)" id="trans-table">

                </tbody>

            </table>

        </div>



    </div>

</div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
