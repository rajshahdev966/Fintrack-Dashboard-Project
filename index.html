<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/output.css" />
    <!-- <link rel="stylesheet" href="" /> -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-(--bg-primary) font-(--font-mono) text-nowrap flex relative"
    id="dashboard-page"
  >
    <div
      class="w-full h-full rounded-2xl bg-transparent p-8 shadow-sm absolute backdrop-blur-sm flex justify-center items-center hidden"
      id="transFormCard"
    >
      <div
        class="w-max h-max bg-white rounded-2xl border-slate-200 p-8 shadow-sm"
      >
        <!-- Header -->
        <div class="mb-8">
          <h2 class="text-3xl font-bold text-slate-800">Add Transaction</h2>
          <p class="mt-2 text-sm text-slate-500">
            Record a new income or expense.
          </p>
        </div>
        <form class="space-y-6">
          <!-- Type -->
          <div>
            <label class="mb-3 block text-sm font-semibold text-slate-700">
              Transaction Type
            </label>
            <select
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
              id="trans-type"
            >
              <option>Income</option>
              <option>Expense</option>
            </select>
          </div>
          <!-- Amount -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-slate-700">
              Amount
            </label>
            <input
              type="number"
              placeholder="₹0.00"
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
            />
          </div>
          <!-- Purpose  -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-slate-700">
              Purpose
            </label>
            <input
              type="text"
              placeholder="Amazon"
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
            />
          </div>
          <!-- Category -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-slate-700">
              Category
            </label>
            <select
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
            >
              <option>Food</option>
              <option>Shopping</option>
              <option>Travel</option>
              <option>Salary</option>
              <option>Investment</option>
              <option>Utilities</option>
            </select>
          </div>
          <!-- Date -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-slate-700">
              Date
            </label>
            <input
              type="date"
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
            />
          </div>
          <!-- Buttons -->
          <div class="flex justify-end gap-4 pt-4">
            <button
              type="button"
              class="rounded-xl border border-slate-300 px-6 py-3 font-semibold text-slate-600 transition hover:bg-slate-100"
              id="cancelBtn"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="rounded-xl bg-sky-500 px-6 py-3 font-semibold text-white shadow transition hover:bg-sky-600"
              id="submitBtn"
            >
              Save Transaction
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- NAVBAR -->

    <nav class="navbar">
      <!-- LOGO OF NAVBAR -->
      <div class="upper-nav flex flex-col gap-5">
        <div class="logo-text text-(--primary) text-4xl font-semibold">
          FinTrack Pro
        </div>

        <!-- NAVABAR MENU  -->
        <div class="nav-menu text-(length:--text-xl) flex flex-col gap-4">
          <div class="dashboard-a navbar-selected">
            <i class="ri-dashboard-fill"></i>
            <a href="./index.html">Dashboard</a>
          </div>
          <div class="transcations-a navbar-links">
            <i class="ri-cash-line"></i>
            <a href="./transcations.html">Transcations</a>
          </div>

          <div class="settings-a navbar-links">
            <i class="ri-settings-2-line"></i>
            <a href="./settings.html">Settings</a>
          </div>
        </div>
      </div>
      <div
        class="profile-section flex gap-2 items-center p-4 rounded-[var(--radius-md)] hover:bg-(--bg-tertiary) cursor-pointer"
      >
        <div class="profile-photo">
          <div
            class="h-10 w-10 rounded-full bg-(--primary) flex items-center justify-center text-3xl font-bold text-slate-600"
            id="profile-icon"
          ></div>
        </div>
        <div class="profile-name text-(--text-primary)">
          <span>ALEX MORGAN</span>
        </div>
      </div>
    </nav>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 p-20 w-full">
      <!-- LEFT SIDE -->
      <div class="lg:col-span-2 h-full w-full space-y-7">
        <!-- TOP CARDS -->
        <div class="grid md:grid-cols-2 gap-6">
          <!-- Net Worth -->
          <div
            class="md:col-span-1 rounded-3xl bg-(--primary) text-white p-8 flex flex-col justify-between"
          >
            <div class="flex flex-col gap-3">
              <p class="text-sm">TOTAL NET WORTH</p>

              <div class="flex gap-1">
                <h1 class="text-5xl font-bold" id="currency-display"></h1>
                <h1 class="text-5xl font-bold" id="net-worth"></h1>
              </div>
            </div>

            <div class="flex gap-4 mt-8">
              <button
                class="bg-white text-(--primary) font-semibold px-6 py-4 rounded-2xl cursor-pointer"
                id="quickAddBtn"
              >
                <i class="ri-add-large-line"></i> Quick Add
              </button>
            </div>
          </div>

          <!-- Right Stats -->
          <div class="space-y-6">
            <div
              class="bg-(--bg-secondary) rounded-3xl shadow p-6 flex items-center gap-5"
            >
              <div
                class="h-14 w-14 rounded-2xl bg-emerald-100 flex items-center justify-center text-2xl"
              >
                ↑
              </div>

              <div>
                <p
                  class="text-xs uppercase font-semibold text-(--text-secondary)"
                >
                  Income
                </p>

                <div class="flex gap-1">
                  <h3
                    class="text-3xl font-bold text-(--secondary)"
                    id="currency-display"
                  ></h3>
                  <h3
                    class="text-3xl font-bold text-(--secondary)"
                    id="income-display"
                  ></h3>
                </div>
              </div>
            </div>

            <div
              class="bg-(--bg-secondary) rounded-3xl shadow p-6 flex items-center gap-5"
            >
              <div
                class="h-14 w-14 rounded-2xl bg-red-100 flex items-center justify-center text-2xl"
              >
                ↓
              </div>

              <div>
                <p
                  class="text-xs uppercase font-semibold text-(--text-secondary)"
                >
                  Expenses
                </p>

                <div class="flex gap-1">
                  <h3
                    class="text-3xl font-bold text-(--danger)"
                    id="currency-display"
                  ></h3>
                  <h3
                    class="text-3xl font-bold text-(--danger)"
                    id="expense-display"
                  ></h3>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Cash Flow -->
        <div
          class="bg-(--bg-secondary) rounded-3xl shadow p-8 flex flex-col gap-5"
        >
          <div class="flex justify-between items-center">
            <h2 class="text-3xl font-bold text-(--text-primary)">
              Cash Flow Trends
            </h2>
          </div>

          <!-- Placeholder Chart -->
          <div
            class="h-100 rounded-2xl border-2 border-dashed border-slate-300 flex items-end justify-center gap-5"
            id="total-graph"
          >
            <div class="w-40 bg-(--success)" id="income-graph">Income</div>
            <div class="w-40 bg-(--danger)" id="expense-graph">Expense</div>
          </div>
        </div>
      </div>

      <!-- RIGHT PANEL -->
      <div
        class="bg-(--bg-secondary) rounded-3xl shadow p-6 flex flex-col gap-4 w-full lg:col-span-1"
      >
        <div class="flex justify-between items-center">
          <h2 class="text-3xl font-bold text-(--text-primary)">Recent</h2>

          <button
            class="text-(--primary-hover) font-semibold cursor-pointer"
            onclick="window.location.href = './transcations.html'"
          >
            VIEW ALL
          </button>
        </div>

        <div class="flex flex-col gap-3" id="recent-trans-list">
          No transcation added yet
        </div>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
