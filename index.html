<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/output.css" />
    <link rel="stylesheet" href="" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[var(--bg-primary)] font-[var(--font-primary)] text-nowrap">
    <nav
      class="bg-[var(--bg-secondary)] h-screen w-min flex flex-col justify-between p-5"
    >
      <div class="upper-nav flex flex-col gap-5">
        <div class="logo-text text-[var(--primary)] text-4xl font-semibold">
          FinTrack Pro
        </div>
        <div class="nav-menu text-(length:--text-xl) flex flex-col gap-4">
          <div class="dashboard-a flex gap-2 items-center p-4 rounded-[var(--radius-md)]">
            <i class="ri-dashboard-fill"></i> <span>Dashboard</span>
          </div>
          <div class="transcations-a flex gap-2 items-center p-4 rounded-[var(--radius-md)]">
            <i class="ri-cash-line"></i> <span>Transcations</span>
          </div>
          <div class="analytics-a flex gap-2 items-center p-4 rounded-[var(--radius-md)]">
            <i class="ri-bar-chart-2-fill"></i> <span>Analytics</span>
          </div>
          <div class="settings-a flex gap-2 items-center p-4 rounded-[var(--radius-md)]">
            <i class="ri-settings-2-line"></i> <span>Settings</span>
          </div>
        </div>
      </div>
      <div class="profile-section flex gap-2 items-center">
        <div class="profile-photo">
          <img
            src="https://plus.unsplash.com/premium_photo-1683121366070-5ceb7e007a97?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="user profile photo" class="h-[50px] w-[50px] rounded-[50%]"
          />
        </div>
        <div class="profile-name"><span>ALEX MORGAN</span></div>
        </div>
      </div>
    </nav>
  </body>
</html>
