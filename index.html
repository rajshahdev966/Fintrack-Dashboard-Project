<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/output.css" />
    <link rel="stylesheet" href="" />
    <style>
      :root {
        --bg-primary: #eef1f6;
        --bg-secondary: #ffffff;
        --bg-tertiary: #e4e9f1;
        --primary: #14544a;
        --primary-hover: #0e3d35;
        --secondary: #2f7d5c;
        --danger: #b8433a;
        --text-primary: #16211f;
        --text-secondary: #64748b;
        --radius-md: 1.1rem;
        --shadow-md: 0 14px 34px -16px rgba(20, 84, 74, 0.28);
        --font-mono: "JetBrains Mono", "Courier New", ui-monospace, monospace;
        --text-xl: 1.125rem;
      }
      #dashboard-page { background-image: radial-gradient(var(--bg-tertiary) 1px, transparent 1px); background-size: 22px 22px; }
      .ri-dashboard-fill::before { content: "▦"; }
      .ri-cash-line::before { content: "◧"; }
      .ri-settings-2-line::before { content: "⚙"; }
      .ri-add-large-line::before { content: "+"; }
      #net-worth, #income-display, #expense-display { font-family: Georgia, "Times New Roman", serif; letter-spacing: -0.02em; }
      .upper-nav .logo-text { font-family: Georgia, serif; letter-spacing: -0.01em; }
      @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .rise-1 { animation: riseIn .5s ease-out both; }
      .rise-2 { animation: riseIn .5s ease-out .08s both; }
      .rise-3 { animation: riseIn .5s ease-out .16s both; }
      .stub-line { background-image: repeating-linear-gradient(to bottom, rgba(255,255,255,.35) 0 6px, transparent 6px 12px); }
    </style>
  </head>
  <body class="bg-[var(--bg-primary)] font-[var(--font-mono)] text-nowrap flex relative" id="dashboard-page">



    <div class="w-full h-full rounded-2xl border border-slate-200 bg-transparent p-8 shadow-sm absolute backdrop-blur-md flex justify-center items-center hidden z-50" id="transFormCard">

    <div class="w-max h-max bg-white rounded-2xl border-slate-200 p-8 shadow-2xl">
        <!-- Header -->
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-slate-800" style="font-family: Georgia, serif;">
                Add Transaction
            </h2>
            <p class="mt-2 text-sm text-slate-500">
                Record a new income or expense.
            </p>
        </div>
        <form class="space-y-6">
            <!-- Type -->
            <div>
                <label class="mb-3 block text-sm font-semibold text-slate-700">
                    Transaction Type
                </label>
                <select
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-[var(--primary)] focus:ring-4 focus:ring-emerald-100" id="trans-type">
                    <option>Income</option>
                    <option>Expense</option>
                </select>
            </div>
            <!-- Amount -->
            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">
                    Amount
                </label>
                <input
                    type="number"
                    placeholder="₹0.00"
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-[var(--primary)] focus:ring-4 focus:ring-emerald-100">
            </div>
            <!-- Purpose  -->
            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">
                    Purpose
                </label>
                <input
                    type="text"
                    placeholder="Amazon"
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-[var(--primary)] focus:ring-4 focus:ring-emerald-100">
            </div>
            <!-- Category -->
            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">
                    Category
                </label>
                <select
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-[var(--primary)] focus:ring-4 focus:ring-emerald-100">
                    <option>Food</option>
                    <option>Shopping</option>
                    <option>Travel</option>
                    <option>Salary</option>
                    <option>Investment</option>
                    <option>Utilities</option>
                </select>
            </div>
            <!-- Date -->
            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">
                    Date
                </label>
                <input
                    type="date"
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-[var(--primary)] focus:ring-4 focus:ring-emerald-100">
            </div>
            <!-- Buttons -->
            <div class="flex justify-end gap-4 pt-4">
                <button
                    type="button"
                    class="rounded-xl border border-slate-300 px-6 py-3 font-semibold text-slate-600 transition hover:bg-slate-100" id="cancelBtn">
                    Cancel
                </button>
                <button
                    type="submit"
                    class="rounded-xl bg-[var(--primary)] px-6 py-3 font-semibold text-white shadow transition hover:bg-[var(--primary-hover)] hover:-translate-y-0.5" id="submitBtn">
                    Save Transaction
                </button>
            </div>
        </form>
    </div>

</div>

    <nav
      class="bg-[var(--bg-secondary)] h-screen w-min flex flex-col justify-between p-5 shadow-(--shadow-md) border-r border-slate-200"
    >
      <div class="upper-nav flex flex-col gap-5">
        <div class="logo-text text-(--primary) text-4xl font-semibold">
          FinTrack Pro
        </div>
        <div class="nav-menu text-(length:--text-xl) flex flex-col gap-4">
          <div class="dashboard-a flex gap-2 items-center p-4 rounded-[var(--radius-md)] bg-(--primary) cursor-pointer text-white shadow-(--shadow-md)">
            <i class="ri-dashboard-fill"></i> <a href="./index.html">Dashboard</a>
          </div>
          <div class="transcations-a flex gap-2 items-center p-4 rounded-[var(--radius-md)] hover:bg-(--bg-tertiary) transition cursor-pointer text-(--text-primary)">
            <i class="ri-cash-line"></i> <a href="./transcations.html">Transcations</a>
          </div>
          
          <div class="settings-a flex gap-2 items-center p-4 rounded-[var(--radius-md)] hover:bg-(--bg-tertiary) transition cursor-pointer text-(--text-primary)">
            <i class="ri-settings-2-line"></i> <a href="./settings.html">Settings</a>
          </div>
        </div>
      </div>
      <div class="profile-section flex gap-2 items-center p-4 rounded-[var(--radius-md)] hover:bg-(--bg-tertiary) transition cursor-pointer">
        <div class="profile-photo">
          <img
            src="https://plus.unsplash.com/premium_photo-1683121366070-5ceb7e007a97?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="user profile photo" class="h-[50px] w-[50px] rounded-[50%] ring-2 ring-(--primary)/20"
          />
        </div>
        <div class="profile-name text-(--text-primary)"><span>ALEX MORGAN</span></div>
        </div>
      </div>
    </nav>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 p-6 md:p-10 lg:p-16">

        <!-- LEFT SIDE -->
        <div class="lg:col-span-2 flex flex-col gap-6">

            <!-- TOP CARDS -->
            <div class="grid md:grid-cols-3 gap-6">

                <!-- Net Worth -->
                <div class="rise-1 md:col-span-2 rounded-3xl bg-(--primary) text-white p-8 flex flex-col justify-between relative overflow-hidden shadow-(--shadow-md)">
                    <div class="stub-line absolute inset-y-0 left-10 w-px"></div>
                    <div class="flex flex-col gap-3">
                        <p class="text-sm tracking-[0.2em] text-white/70">
                            TOTAL NET WORTH
                        </p>

                        <h1 class="text-5xl font-bold" id="net-worth">
                        </h1>
                    </div>

                    <div class="flex gap-4 mt-8">

                        <button
                            class="bg-white text-(--primary) font-semibold px-6 py-4 rounded-2xl cursor-pointer transition hover:-translate-y-0.5 hover:shadow-lg" id="quickAddBtn">
                            <i class="ri-add-large-line"></i> Quick Add
                        </button>
                    </div>

                </div>

                <!-- Right Stats -->
                <div class="space-y-6">

                    <div
                        class="rise-2 bg-(--bg-secondary) rounded-3xl shadow-(--shadow-md) p-6 flex items-center gap-5 border border-slate-100 transition hover:-translate-y-1">

                        <div
                            class="h-14 w-14 rounded-2xl bg-emerald-100 flex items-center justify-center text-2xl text-(--secondary)">
                            ↑
                        </div>

                        <div>
                            <p class="text-xs uppercase font-semibold text-(--text-secondary) tracking-widest">
                                Income
                            </p>

                            <h3 class="text-3xl font-bold text-(--secondary)" id="income-display">
                                
                            </h3>
                        </div>

                    </div>

                    <div
                        class="rise-3 bg-(--bg-secondary) rounded-3xl shadow-(--shadow-md) p-6 flex items-center gap-5 border border-slate-100 transition hover:-translate-y-1">

                        <div
                            class="h-14 w-14 rounded-2xl bg-red-100 flex items-center justify-center text-2xl text-(--danger)">
                            ↓
                        </div>

                        <div>
                            <p class="text-xs uppercase font-semibold text-(--text-secondary) tracking-widest">
                                Expenses
                            </p>

                            <h3 class="text-3xl font-bold text-(--danger)" id="expense-display">
                                
                            </h3>
                        </div>

                    </div>

                </div>

            </div>

            <!-- Cash Flow -->
            <div class="bg-(--bg-secondary) rounded-3xl shadow-(--shadow-md) p-8 flex flex-col gap-5 border border-slate-100">

                <div class="flex justify-between items-center">

                    <h2 class="text-3xl font-bold text-(--text-primary)" style="font-family: Georgia, serif;">
                        Cash Flow Trends
                    </h2>

                </div>

                <!-- Placeholder Chart -->
                <div
                    class="h-64 rounded-2xl border-2 border-dashed border-slate-300 flex items-center justify-center text-slate-400">
                    Chart goes here
                </div>

            </div>

        </div>

        <!-- RIGHT PANEL -->
        <div class="bg-(--bg-secondary) rounded-3xl shadow-(--shadow-md) p-6 flex flex-col gap-4 w-full border border-slate-100 h-fit">

            <div class="flex justify-between items-center">

                <h2 class="text-3xl font-bold text-(--text-primary)" style="font-family: Georgia, serif;">
                    Recent
                </h2>

                <button class="text-(--primary-hover) font-semibold cursor-pointer text-sm tracking-wide hover:underline">
                    VIEW ALL
                </button>

            </div>

            <div class="flex flex-col gap-3 text-(--text-secondary)" id="recent-trans-list">
                No transcation added yet
            </div>

        </div>

    </div>
    
    <script type="module" src="./js/main.js"></script>

  </body>
</html>
